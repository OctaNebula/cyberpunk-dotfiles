# Font configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

# Window layout
window_padding_width 10
confirm_os_window_close 0
active_border_color #0abdc6
inactive_border_color #414868
draw_minimal_borders yes
window_border_width 1pt

# Transparency
background_opacity 0.85
# Disable ligatures to prevent symbol joining issues
disable_ligatures always

# Colors (Tokyo Night / Cyberpunk inspired)
background            #050508
foreground            #00ffff
selection_background  #283457
selection_foreground  #c0caf5
url_color             #00ffff

# Cursor
cursor                #ff007c
cursor_text_color     #1a1b26

# Tabs
active_tab_background   #ff007c
active_tab_foreground   #1a1b26
inactive_tab_background #292e42
inactive_tab_foreground #545c7e

# --- Terminal Color Palette ---

# Black (Background/Shadows)
color0 #15161e
color8 #414868

# Red (Pink/Errors)
color1 #ff007c
color9 #ff007c

# Green (Cyan/Executables)
color2  #00ffff
color10 #00ffff

# Yellow (Cyan/Warnings)
color3  #00ffff
color11 #00ffff

# Blue (Cyan/Directories)
color4  #00ffff
color12 #00ffff

# Magenta (Pink/Special)
color5  #ff007c
color13 #ff007c

# Cyan (Primary Cyan)
color6  #00ffff
color14 #00ffff

# White (Base Text)
color7  #005c5c
color15 #005c5c
