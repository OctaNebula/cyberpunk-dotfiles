general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple instances
    before_sleep_cmd = loginctl lock-session    # Lock the screen BEFORE going to sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # Wake up the screen when you open the lid
}

